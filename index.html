<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hellworld</title>
  <meta name="description" content="Hellworld: RPG de acción de mundo abierto en el navegador.">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b10'/%3E%3Cpath d='M16 4l9 12-9 12-9-12z' fill='%23d8344d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="altar-menu" class="menu hidden" role="dialog" aria-label="Altar">
    <div class="menu-box">
      <h2>Altar</h2>
      <p class="menu-note">Descansas: vida y maná al máximo. Los demonios regresan.</p>
      <p class="menu-souls">Almas: <span id="menu-souls">0</span></p>
      <div id="menu-stats"></div>
      <div class="menu-extra">
        <button id="menu-sound">Sonido: activado</button>
        <button id="menu-reset">Nueva partida</button>
      </div>
      <button id="menu-close" class="menu-close">Salir (Esc)</button>
    </div>
  </div>

  <div id="dialog" class="menu hidden" role="dialog" aria-label="Diálogo">
    <div class="menu-box">
      <h2 id="dialog-name"></h2>
      <p id="dialog-text" class="dialog-text"></p>
      <button id="dialog-ok" class="menu-close"></button>
    </div>
  </div>

  <script type="module" src="JS/main.js"></script>
</body>
</html>
